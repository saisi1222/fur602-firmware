name: Build FUR-602 firmware

on:
  workflow_dispatch:
  push:
    branches: [ main, fur602-firmware ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout build repo (patches / device / config)
        uses: actions/checkout@v4
        with:
          path: fur602-build

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache

      - name: Clone padavanonly base (openwrt-24.10-6.6)
        run: |
          git clone --depth 1 --branch openwrt-24.10-6.6 \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6 padavanonly

      - name: Add HONOR FUR-602 device (DTS + filogic.mk, closed mtwifi)
        run: |
          cp fur602-build/fur602-patches/dts/mt7981b-honor-fur-602.dts \
             padavanonly/target/linux/mediatek/dts/
          python3 fur602-build/fur602-patches/apply-device.py \
             padavanonly/target/linux/mediatek/image/filogic.mk

      - name: Add nft fullcone kernel-module feed
        run: |
          echo "src-git fullcone https://github.com/fullcone-nat-nftables/nft-fullcone.git" \
            >> padavanonly/feeds.conf.default

      - name: Update & install feeds
        working-directory: padavanonly
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 早暴露 fullcone feed 是否被正确识别（根目录单包 Makefile）
          ls package/feeds/fullcone/ 2>/dev/null || { echo "ERROR: fullcone feed not picked up"; exit 1; }

      - name: Configure (.config -> defconfig)
        working-directory: padavanonly
        run: |
          cp ../fur602-build/fur602-patches/fur602.config .config
          make defconfig
          # 确保 nft_fullcone 所需的内核选项为 y
          ./scripts/config -e NF_CONNTRACK_EVENTS -e NF_CONNTRACK_CHAIN_EVENTS
          make defconfig

      - name: Verify key selections (fail-fast)
        working-directory: padavanonly
        run: |
          echo "--- DEVICE / fullcone / mtwifi / cpufreq in .config ---"
          grep -E "DEVICE_honor_fur-602|kmod-nft-fullcone|kmod-mt_wifi|CONFIG_PACKAGE_cpufreq" .config || true
          # 任一关键项未进入 .config 则立即中止，避免白编 2 小时
          for k in \
            CONFIG_TARGET_mediatek_filogic_DEVICE_honor_fur-602=y \
            CONFIG_PACKAGE_kmod-nft-fullcone=y \
            CONFIG_PACKAGE_kmod-mt_wifi=y ; do
            grep -qxF "$k" .config || { echo "ERROR: missing $k"; exit 1; }
          done
          echo "OK: 关键选型均已进入 .config"

      - name: Download sources
        working-directory: padavanonly
        run: make download -j8

      - name: Build firmware
        working-directory: padavanonly
        run: make -j$(nproc)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fur602-firmware
          path: |
            padavanonly/bin/targets/mediatek/filogic/*sysupgrade.bin
            padavanonly/bin/targets/mediatek/filogic/*factory.bin
          if-no-files-found: error
