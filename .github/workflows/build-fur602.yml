name: Build FUR-602 firmware

on:
  workflow_dispatch:
  push:
    branches: [ main, fur602-firmware ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout build repo (patches / device / config)
        uses: actions/checkout@v4
        with:
          path: fur602-build

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache \
            texinfo ninja-build

      - name: Free up disk space
        run: |
          # GitHub-hosted runner 默认剩余磁盘有限，OpenWrt 全量编译极易撑爆。
          # 删除与编译无关的预装软件栈，腾出约 10GB。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "--- disk after cleanup ---"
          df -h / /mnt 2>/dev/null || df -h /

      - name: Clone padavanonly base (openwrt-24.10-6.6)
        run: |
          git clone --depth 1 --branch openwrt-24.10-6.6 \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6 padavanonly

      - name: Add HONOR FUR-602 device (DTS + filogic.mk, closed mtwifi)
        run: |
          cp fur602-build/fur602-patches/dts/mt7981b-honor-fur-602.dts \
             padavanonly/target/linux/mediatek/dts/
          python3 fur602-build/fur602-patches/apply-device.py \
             padavanonly/target/linux/mediatek/image/filogic.mk

      - name: Add nft fullcone kernel module (vendored local package)
        run: |
          mkdir -p padavanonly/package/kernel/nft-fullcone
          cp -r fur602-build/fur602-patches/nft-fullcone/. padavanonly/package/kernel/nft-fullcone/
          test -f padavanonly/package/kernel/nft-fullcone/Makefile \
            || { echo "ERROR: nft-fullcone Makefile missing"; exit 1; }

      - name: Update & install feeds
        working-directory: padavanonly
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # nft-fullcone 以本地包形式提供（非 feed），确认已就位
          test -f package/kernel/nft-fullcone/Makefile \
            || { echo "ERROR: nft-fullcone package not present"; exit 1; }

      - name: Configure (.config -> defconfig)
        working-directory: padavanonly
        run: |
          cp ../fur602-build/fur602-patches/fur602.config .config
          make defconfig
          # 注意: padavanonly 树里 scripts/config 是一个“目录”，不是 kconfig 包装脚本，
          # 执行 ./scripts/config -e 会报 "Is a directory" (exit 126)。
          # NF_CONNTRACK_EVENTS / NF_CONNTRACK_CHAIN_EVENTS 无需手工设置：
          # nft-fullcone 包 Makefile 的 KCONFIG:= 会在编译内核时自动注入。
          echo "--- 关键选型自检 ---"
          grep -E "^CONFIG_TARGET_mediatek_filogic=|^CONFIG_TARGET_mediatek_filogic_DEVICE_honor_fur-602=|^CONFIG_PACKAGE_kmod-(nft-fullcone|mt_wifi)=|^CONFIG_NF_CONNTRACK_(CHAIN_)?EVENTS=" .config || true

      - name: Verify key selections (fail-fast)
        working-directory: padavanonly
        run: |
          echo "--- DEVICE / fullcone / mtwifi in .config ---"
          grep -E "DEVICE_honor_fur-602|kmod-nft-fullcone|kmod-mt_wifi" .config || true
          # 任一关键项未进入 .config 则立即中止，避免白编 2 小时
          for k in \
            CONFIG_TARGET_mediatek_filogic_DEVICE_honor_fur-602=y \
            CONFIG_PACKAGE_kmod-nft-fullcone=y \
            CONFIG_PACKAGE_kmod-mt_wifi=y ; do
            grep -qxF "$k" .config || { echo "ERROR: missing $k"; exit 1; }
          done
          echo "OK: 关键选型均已进入 .config"

      - name: Download sources
        working-directory: padavanonly
        run: make download -j8

      - name: Build firmware
        working-directory: padavanonly
        # 不开 V=s：verbose 日志会把 GitHub 8MB 日志上限撑爆导致真实报错被截断，
        # 紧凑日志反而能看到 "ERROR: package/X failed to build" 这一行。
        run: make -j$(nproc)

      - name: Diagnose failing package (on failure)
        if: failure()
        working-directory: padavanonly
        run: |
          # 只重编失败包并开 V=s，快速暴露真实 gcc/内核 API 报错，避免整编一小时盲猜
          make package/kernel/nft-fullcone/compile V=s 2>&1 | tail -80 || true
          make package/kernel/nft-fullcone/compile V=s 2>&1 | grep -iE "error:|undefined|\.c:[0-9]+:[0-9]+" | head -40 || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fur602-firmware
          path: |
            padavanonly/bin/targets/mediatek/filogic/*sysupgrade.bin
            padavanonly/bin/targets/mediatek/filogic/*factory.bin
          if-no-files-found: error
