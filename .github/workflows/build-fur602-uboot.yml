name: Build FUR-602 U-Boot (Yuzhii multi-layout)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Yuzhii bl-mt798x-dhcpd tag to build'
        required: false
        default: '2026.08.31-1437-all'
  push:
    branches: [uboot]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YUZHII_TAG: ${{ github.event.inputs.tag || '2026.08.31-1437-all' }}
    steps:
      - name: Checkout Yuzhii uboot source (tag ${{ env.YUZHII_TAG }})
        uses: actions/checkout@v4
        with:
          repository: Yuzhii0718/bl-mt798x-dhcpd
          ref: ${{ env.YUZHII_TAG }}
          fetch-depth: 1
          path: uboot-src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential flex bison libssl-dev device-tree-compiler qemu-user-static nodejs npm

      - name: failsafe embedded npm install (if present)
        working-directory: uboot-src/uboot-mtk-20250711/failsafe/embedded
        run: |
          if [ -d failsafe/embedded ] || [ -f package.json ]; then
            npm install
          else
            echo "failsafe/embedded not found at expected path; skipping npm install"
            ls -la
          fi

      - name: Ensure immortalwrt-112m layout present in FUR-602 DTS
        working-directory: uboot-src/uboot-mtk-20250711/arch/arm/dts
        run: |
          set -e
          DTS=mt7981-honor_fur-602.dts
          if [ ! -f "$DTS" ]; then
            echo "ERROR: $DTS not found"; ls -1 | grep -i fur || true; exit 1
          fi
          if grep -q 'immortalwrt-112m' "$DTS"; then
            echo "immortalwrt-112m already present in $DTS -> keep as-is"
          else
            echo "immortalwrt-112m missing -> injecting the standard ImmortalWrt 112M layout (ubi@0x600000) into $DTS"
            python3 - <<'PY'
          import re
          p="mt7981-honor_fur-602.dts"
          t=open(p,encoding='utf-8').read()
          block=(
              "\t\tlayout@2 {\n"
              "\t\t\tlabel = \"immortalwrt-112m\";\n"
              "\t\t\tmtdids = \"nmbm0=nmbm0\";\n"
              "\t\t\tmtdparts = \"nmbm0:1024k(bl2),256k(Nvram),256k(Bdata),2048k(factory),2048k(fip),256k(crash),256k(crash_log),112m(ubi),256k(KF)\";\n"
              "\t\t};"
          )
          # insert layout@2 INSIDE the /mtd-layout node, right before its inner closing (1-tab) '};'
          m=re.search(r'(/mtd-layout\s*\{.*?)\n\t\};', t, re.S)
          if not m:
              raise SystemExit("mtd-layout node not found in " + p)
          t=t[:m.start()]+m.group(1)+"\n"+ "".join(block)+"\n\t};"+t[m.end():]
          open(p,'w',encoding='utf-8').write(t)
          print("injected standard immortalwrt-112m layout inside /mtd-layout")
          PY
          fi
          # hedge: also provide the underscore-named DTS copy so build.sh finds it under either naming convention
          if [ ! -f mt7981_honor_fur-602.dts ]; then
            cp mt7981-honor_fur-602.dts mt7981_honor_fur-602.dts
            echo "created mt7981_honor_fur-602.dts copy"
          fi
          echo "=== resulting mtd-layout labels ==="
          grep -n 'label = "' "$DTS" || true

      - name: Build U-Boot (MULTI_LAYOUT=1)
        working-directory: uboot-src
        run: |
          SOC=mt7981 BOARD=honor_fur-602 VERSION=2026 MULTI_LAYOUT=1 ./build.sh

      - name: Show build outputs
        working-directory: uboot-src
        run: |
          echo "=== *.bin under uboot-mtk-20250711 ==="
          ls -la uboot-mtk-20250711/*.bin 2>/dev/null || true
          echo "=== all *.bin in tree ==="
          find . -name '*.bin' -print -exec ls -la {} \; 2>/dev/null || true

      - name: Upload U-Boot artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fur602-uboot-${{ github.run_number }}
          path: |
            uboot-src/**/*.bin
          if-no-files-found: warn
