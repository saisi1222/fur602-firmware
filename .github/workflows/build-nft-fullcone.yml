name: Build nft_fullcone.ko for HONOR FUR-602 (kernel 6.6.133)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340

    steps:
      - name: Checkout (builder repo: kernel.config + this workflow)
        uses: actions/checkout@v4

      - name: Show disk space
        run: df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-dev rsync swig \
            unzip zlib1g-dev file wget xsltproc zstd ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Clone ImmortalWrt v24.10.6 (kernel 6.6.133, has package fullconenat-nft)
        run: |
          git clone --depth 1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt owrt
          cd owrt && git log -1 --oneline

      - name: Feeds
        run: |
          cd owrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Override target kernel config with the RUNNING kernel config (ABI match)
        run: |
          ls -la kernel.config
          cp kernel.config owrt/target/linux/mediatek/filogic/config-6.6
          echo "--- sanity ---"
          grep -E '^(CONFIG_MODVERSIONS|CONFIG_MODULE_SIG)=' kernel.config || echo "MODVERSIONS/SIG not set (good)"
          grep -E '^CONFIG_CC_VERSION_TEXT' kernel.config

      - name: Generate .config (target only, multi-profile, no device-specific image)
        run: |
          cd owrt
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=n
          CONFIG_PACKAGE_kmod-nft-fullcone=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          EOF
          make defconfig
          echo "--- selected ---"
          grep -E 'kmod-nft-fullcone|CONFIG_TARGET' .config | head

      - name: Build tools + toolchain
        run: cd owrt && make -j$(nproc) tools/install toolchain/install

      - name: Build kernel (6.6.133)
        run: cd owrt && make -j$(nproc) target/linux/compile

      - name: Build nft_fullcone module
        run: cd owrt && make -j$(nproc) package/network/utils/fullconenat-nft/compile V=s

      - name: Collect artifacts
        run: |
          mkdir -p out
          find owrt/bin owrt/build_dir -name 'nft_fullcone.ko' -exec cp {} out/ \; 2>/dev/null || true
          find owrt/bin owrt/staging_dir -name 'kmod-nft-fullcone*.ipk' -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/
          echo "=== vermagic (must be: 6.6.133 SMP mod_unload aarch64) ==="
          for f in out/nft_fullcone.ko; do
            [ -f "$f" ] && modinfo "$f" | grep -E 'vermagic|depends|filename' || true
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nft_fullcone-6.6.133
          path: out/
          if-no-files-found: warn
