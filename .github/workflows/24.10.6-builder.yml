name: OpenWrt 24.10.6 Builder (FUR-602)

# 用法：
#   - 源码：官方 immortalwrt/immortalwrt @ tag v24.10.6（kernel 6.6，开源 mt76 + 主线 mtk_ppe PPE + WED）
#   - 配置：fur602-2410-6/config.seed（24.10 配置去闭源/6.6专属 + 开源 MT7981 驱动 + kmod-nft-offload + kmod-nft-fullcone），CI 内 make defconfig 解析
#   - 触发：push 到 24.10.6 分支（改动 fur602-2410-6/**），或手动 workflow_dispatch
on:
  workflow_dispatch:
  push:
    branches: [24.10.6]
    paths:
      - '.github/workflows/24.10.6-builder.yml'
      - 'fur602-2410-6/**'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v24.10.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build materials
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/lib/jvm 2>/dev/null || true
          sudo apt-get clean || true
          df -h || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget device-tree-compiler

      - name: Clone source (${{ env.REPO_BRANCH }})
        run: |
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt && git log -1 --format='HEAD=%H%ndate=%ad%nsubject=%s'

      - name: Update & install feeds (官方默认 feeds，开源驱动在 tree 内)
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject FUR-602 device support (DTS + device profile + network)
        run: python3 fur602-2410-6/inject_device.py openwrt

      - name: Add uci-defaults (LAN 192.168.110.1 + Wifi + IPv6)
        run: |
          mkdir -p openwrt/files
          cp -r fur602-2410-6/files/. openwrt/files/
          chmod +x openwrt/files/etc/uci-defaults/*

      - name: Load config (.config from seed -> make defconfig)
        working-directory: openwrt
        run: |
          cp ../fur602-2410-6/config.seed .config
          make defconfig
          # 兜底 libustream（历史失败点）
          if ! grep -q "^CONFIG_PACKAGE_libustream" .config; then
            echo "CONFIG_PACKAGE_libustream-openssl20201210=y" >> .config
            make defconfig
          fi
          echo "=== 关键项确认 ==="
          grep -E "CONFIG_TARGET_DEVICE|CONFIG_PACKAGE_kmod-mt7915e|CONFIG_PACKAGE_kmod-mt7981-firmware|CONFIG_PACKAGE_kmod-nft-offload|CONFIG_PACKAGE_kmod-nft-fullcone|zram-swap|luci-app-firewall" .config || true
          fail=0
          # 注意：luci-app-autoreboot 已在 config.seed 剔除（无排程即空转轮询守护），故此处不再校验
          for sym in \
            "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_honor_fur-602=y" \
            "CONFIG_PACKAGE_kmod-mt7915e=y" \
            "CONFIG_PACKAGE_kmod-mt7981-firmware=y" \
            "CONFIG_PACKAGE_mt7981-wo-firmware=y" \
            "CONFIG_PACKAGE_kmod-nft-offload=y" \
            "CONFIG_PACKAGE_kmod-nft-fullcone=y" \
            "CONFIG_PACKAGE_dnsmasq-full=y" \
            "CONFIG_PACKAGE_dropbear=y" \
            "CONFIG_PACKAGE_zram-swap=y" \
            "CONFIG_PACKAGE_luci-app-firewall=y" ; do
            if ! grep -q "^${sym}" .config; then echo "[FAIL] 缺少关键配置: $sym"; fail=1; fi
          done
          [ "$fail" = "0" ] || exit 1
          cp .config ../config-final.txt

      - name: Build
        working-directory: openwrt
        run: |
          make -j$(nproc) download
          make -j$(nproc) || make -j1 V=s

      - name: List images
        if: always()
        working-directory: openwrt
        run: |
          ls -la bin/targets/mediatek/filogic/ 2>/dev/null || true

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fur602-2410-6-immortalwrt
          path: openwrt/bin/targets/mediatek/filogic/*honor_fur-602*.bin
          if-no-files-found: warn

      - name: Upload final .config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-final-24106
          path: config-final.txt
          if-no-files-found: warn

      - name: Diagnose on failure
        if: failure()
        working-directory: openwrt
        run: |
          echo "=== 磁盘 ==="; df -h || true
          echo "=== 最近构建日志 ==="
          ls -la logs 2>/dev/null || true
          tail -n 150 logs/*.log 2>/dev/null || true
