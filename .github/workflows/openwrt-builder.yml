name: OpenWrt Builder

# 用法：
#   - 换源码：只改下面 env 的 REPO_URL / REPO_BRANCH
#   - 配置：优先用 fur602-imm/config.full（固定 .config，避免 Actions 内推断不一致）；
#           不存在时用 fur602-imm/config.seed 生成，并把最终 .config 作为 artifact 回传
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openwrt-builder.yml'
      - 'fur602-imm/**'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  MTK_FEED_OFFICIAL: https://git01.mediatek.com/openwrt/feeds/mtk-openwrt-feeds
  MTK_FEED_MIRROR: https://github.com/GainStrongService/mtk-openwrt-feeds.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build materials
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/lib/jvm 2>/dev/null || true
          sudo apt-get clean || true
          df -h || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget device-tree-compiler

      - name: Clone source (${{ env.REPO_BRANCH }})
        run: |
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt && git log -1 --format='HEAD=%H%ndate=%ad%nsubject=%s'

      - name: Add MTK feed + 24.10 patches (kmod-mediatek_hnat 等)
        working-directory: openwrt
        run: |
          set -x
          # 直接用 GitHub 镜像（git01.mediatek.com 在 Actions 内经常超时/不可达）
          echo "src-git mtk_openwrt_feed $MTK_FEED_MIRROR" >> feeds.conf.default
          cat feeds.conf.default
          if ! timeout 900 ./scripts/feeds update -a; then
            echo "[!] mirror failed -> fallback official"
            sed -i "s|$MTK_FEED_MIRROR|$MTK_FEED_OFFICIAL|" feeds.conf.default
            ./scripts/feeds update -a
          fi
          ./scripts/feeds install -a || true
          ls -d feeds/mtk_openwrt_feed 2>/dev/null && ls feeds/mtk_openwrt_feed || echo "FEED MISSING"
          if [ -d ./feeds/mtk_openwrt_feed/24.10 ]; then
            # 关键（踩过的坑）：只拷 tools。
            #   files/target 里带 files-6.6/arch/arm64/boot/dts/mediatek/mt7988d-rfb.dts，
            #   它会覆盖内核树同名文件，导致源码自带补丁
            #   target/linux/mediatek/patches-6.6/999-3027-dts-88d-option-type-2-support.patch
            #   Hunk #1 FAILED -> target/linux 编译中断（run 37964085004 就是这个）。
            #   files/package/mtk 也会覆盖源码自带的闭源 mt_wifi（源码 package/mtk 已有），
            #   覆盖后 Kconfig 与 defconfig 对不上，无线驱动会消失。两者都不拷。
            cp -af ./feeds/mtk_openwrt_feed/24.10/files/tools/. ./tools/ 2>/dev/null || true
            echo "[i] copied: 24.10/files/tools -> tools/ (xxhash)"
            # 只应用 08xx（tools/sdk 类）。其余全部跳过，实测证据：
            #   - files/target 里的 mt7988* dts/dtso 覆盖 -> 999-3027 Hunk FAILED（run 37964085004）
            #   - patches-base/1002 往源码自带的 mt7988a-rfb-emmc.dtso 再插两组 fragment
            #     -> dtc: ERROR (duplicate_node_names) /fragment@1（run 37969444155）
            #   padavanonly 这份源码已把 MTK feed 内容整合进来（自带 package/mtk、files-6.6），
            #   再叠 feed 的 dts/image 补丁必然重复。feed 只用来提供包定义。
            for file in $(find ./feeds/mtk_openwrt_feed/24.10/patches-base -name "*.patch" | sort); do
              base=$(basename "$file")
              case "$base" in
                08*) ;;
                *) echo "  [skip] 源码已整合，重复应用会破坏 dts/image: $base"; continue;;
              esac
              if patch -p1 --dry-run --forward -i "$file" >/dev/null 2>&1; then
                patch -p1 --forward -i "$file" >/dev/null && echo "  [ok]   $file" || echo "  [warn] $file"
              else
                echo "  [skip] cannot apply cleanly: $base"
              fi
            done
          else
            echo "  [warn] feeds/mtk_openwrt_feed/24.10 not found"
          fi
          # 删掉与 mt7981/602 无关、且易受 dts 版本影响的 mt7988d 补丁（只给 mt7988d-rfb.dts 加 pcie option_type）
          rm -f target/linux/mediatek/patches-6.6/999-3027-dts-88d-option-type-2-support.patch
          ls target/linux/mediatek/patches-6.6/ | grep -c "patch$" || true
          ./scripts/feeds install -a || true

      - name: Inject FUR-602 device support (DTS + device profile + network)
        run: python3 fur602-imm/inject_device.py openwrt

      - name: Add nft-fullcone package (kernel 6.6 fixed)
        run: |
          mkdir -p openwrt/package/nft-fullcone
          cp -r fur602-imm/package/nft-fullcone/. openwrt/package/nft-fullcone/
          ls -l openwrt/package/nft-fullcone/

      - name: Add uci-defaults (LAN 192.168.110.1 + Wifi + IPv6)
        run: |
          mkdir -p openwrt/files
          cp -r fur602-imm/files/. openwrt/files/
          chmod +x openwrt/files/etc/uci-defaults/*
          ls -l openwrt/files/etc/uci-defaults/

      - name: Load config (.config)
        working-directory: openwrt
        run: |
          if [ -f ../fur602-imm/config.full ]; then
            echo "[i] using pinned fur602-imm/config.full"
            cp ../fur602-imm/config.full .config
          else
            echo "[FAIL] 缺少 fur602-imm/config.full（固定配置）。拒绝用 seed 编译："
            echo "       它的 MTK 无线 Kconfig 不完整，会编出没有无线驱动的固件。"
            exit 1
          fi
          make defconfig
          # 兜底：必须选中一个 libustream 变体（历史失败点）
          if ! grep -q "^CONFIG_PACKAGE_libustream" .config; then
            echo "[!] no libustream selected -> force openssl variant"
            echo "CONFIG_PACKAGE_libustream-openssl20201210=y" >> .config
            make defconfig
          fi
          echo "=== 关键项确认 ==="
          grep -E "CONFIG_TARGET_DEVICE|CONFIG_PACKAGE_kmod-(nft-fullcone|mediatek_hnat|mt_wifi)|libustream|zram-swap|autoreboot|luci-app-firewall|wifi-dats" .config || true
          # 硬校验：缺一项就直接失败，避免白跑一小时
          fail=0
          for sym in \
            "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_honor_fur-602=y" \
            "CONFIG_PACKAGE_kmod-mediatek_hnat=y" \
            "CONFIG_PACKAGE_kmod-mt_wifi=y" \
            "CONFIG_PACKAGE_kmod-nft-fullcone=y" \
            "CONFIG_PACKAGE_zram-swap=y" \
            "CONFIG_PACKAGE_luci-app-autoreboot=y" \
            "CONFIG_PACKAGE_luci-app-firewall=y" \
            "CONFIG_MTK_MT_WIFI=" \
            "CONFIG_MTK_CHIP_MT7981=y" \
            "CONFIG_MTK_FIRST_IF_MT7981=y" ; do
            if ! grep -q "^${sym}" .config; then echo "[FAIL] 缺少关键配置: $sym"; fail=1; fi
          done
          [ "$fail" = "0" ] || exit 1
          cp .config ../config-final.txt

      - name: Build
        working-directory: openwrt
        run: |
          make -j$(nproc) download
          make -j$(nproc) || make -j1 V=s

      - name: Verify built kmods (hnat + mt_wifi)
        working-directory: openwrt
        run: |
          echo "=== 已生成的 kmod 包 ==="
          find bin/targets -name "kmod-mediatek_hnat*.ipk" -o -name "kmod-mt_wifi*.ipk" -o -name "kmod-nft-fullcone*.ipk" | sort
          fail=0
          for k in kmod-mediatek_hnat kmod-mt_wifi kmod-nft-fullcone; do
            if ! find bin/targets -name "${k}_*.ipk" | grep -q .; then echo "[FAIL] 未生成 $k"; fail=1; fi
          done
          [ "$fail" = "0" ] || exit 1

      - name: List images
        if: always()
        working-directory: openwrt
        run: |
          ls -la bin/targets/mediatek/filogic/ 2>/dev/null || true

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fur602-immortalwrt
          path: openwrt/bin/targets/mediatek/filogic/*honor_fur-602*.bin
          if-no-files-found: warn

      - name: Upload final .config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-final
          path: config-final.txt
          if-no-files-found: warn

      - name: Diagnose on failure
        if: failure()
        working-directory: openwrt
        run: |
          echo "=== 磁盘 ==="; df -h || true
          echo "=== 最近构建日志 ==="
          ls -la logs 2>/dev/null || true
          tail -n 150 logs/*.log 2>/dev/null || true
