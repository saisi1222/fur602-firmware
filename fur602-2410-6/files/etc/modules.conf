# WED（Wireless Ethernet Dispatch）：MT7981 的无线流量要进 PPE 硬件转发必须开
# 官方 24.10+ 写法是写进 /etc/modules.conf（旧版写 /etc/modules.d/mt7915e）
# 实测证据：MT7531+MT7981B 不开 WED 时 /sys/kernel/debug/ppe0/bind 一直 UNB，
# 加 mt7915e wed_enable=Y 后才出现 BND（含无线客户端的条目）。
# 代价：无线 AQL(QoS) 失效 —— 我们本来就不用 SQM，可接受。
options mt7915e wed_enable=Y
